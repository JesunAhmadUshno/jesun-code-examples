name: Examples

# Runs every .jc example on the Jesun.Code interpreter pinned at commit 1282f9a
# and fails if any output differs from expected/<name>.out.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JesunAhmadUshno/jesun-code
          ref: 1282f9a9997d3ac81b029cb54df57f60d7a3d341
          path: jesun-code
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_examples.py
        env:
          JESUN_CODE: jesun-code/jesun.py
